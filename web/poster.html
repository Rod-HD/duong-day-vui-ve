<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster QR · Đường Dây Vui Vẻ</title>
  <style>
    @page { size: A5 portrait; margin: 0; }
    :root { --paper: #F6F1E7; --ink: #111; --blue: #1F4FD8; --yellow: #FFD23F; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
    .sheet {
      width: 148mm; min-height: 210mm; margin: 16px auto; padding: 14mm 12mm;
      background: var(--paper); border: 2px solid var(--ink);
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6mm;
    }
    .kicker { margin: 0; font: 12px ui-monospace, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font: 900 34pt/0.95 "Arial Black", "Segoe UI Black", system-ui, sans-serif; letter-spacing: -0.02em; }
    .sun { width: 30mm; }
    .qr { padding: 5mm; background: #fff; border: 2px solid var(--ink); border-radius: 4mm; box-shadow: 2mm 2mm 0 var(--ink); }
    .qr img { display: block; width: 62mm; height: 62mm; }
    .cta { margin: 0; font: 900 18pt/1.15 "Arial Black", "Segoe UI Black", system-ui, sans-serif; background: var(--yellow); padding: 1mm 3mm; transform: rotate(-1.5deg); }
    .how { margin: 0; font-size: 12pt; max-width: 110mm; }
    .url { margin: auto 0 0; font: 11pt ui-monospace, Consolas, monospace; color: var(--blue); }
    .print { position: fixed; right: 16px; bottom: 16px; padding: 12px 18px; font: 800 15px system-ui, sans-serif; background: var(--yellow); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
    @media print { body { background: none; } .sheet { margin: 0; border: 0; } .print { display: none; } }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="kicker">Đường dây nóng của các bạn nhỏ</p>
    <h1>Đường Dây Vui Vẻ</h1>
    <svg class="sun" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M60 5v15M60 101v13M5 61h14M101 59h15M21 20l11 11M89 90l10 10M20 99l11-10M88 31l11-11" stroke="#1F4FD8" stroke-width="6" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="33" fill="#FFD23F" stroke="#111" stroke-width="4"/>
      <circle cx="49" cy="54" r="4.2" fill="#111"/><circle cx="71" cy="54" r="4.2" fill="#111"/>
      <path d="M47 67q13 13 26 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="qr"><img src="qr.svg" alt="Mã QR mở trang Đường Dây Vui Vẻ"></div>
    <p class="cta">Quét mã, bấm số,<br>nghe lời động viên</p>
    <p class="how">Mở camera điện thoại, quét mã, rồi bấm một số từ 0 đến 7 để nghe các bạn nhỏ cổ vũ bạn. Miễn phí, không cần cài đặt.</p>
    <p class="url">duong-day-vui-ve.onrender.com</p>
  </main>
  <button class="print" type="button" onclick="print()">In poster</button>
</body>
</html>
